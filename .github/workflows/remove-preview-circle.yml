name: Remove preview circle

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-circle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove decorative preview circle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          block = '''    .preview-stage::before {
      position: absolute;
      top: -26px;
      right: -24px;
      width: 82px;
      height: 82px;
      content: "";
      background: var(--yellow);
      border: 5px solid var(--white);
      border-radius: 50%;
      box-shadow: 0 7px 0 rgba(123, 47, 0, 0.22);
    }

'''
          mobile = '''      .preview-stage::before {
        right: -13px;
        width: 60px;
        height: 60px;
      }

'''

          updated = s.replace(block, '').replace(mobile, '')
          if updated == s:
              print('No matching circle styles found; nothing to change.')
          else:
              p.write_text(updated, encoding='utf-8')
              print('Preview circle styles removed.')
          PY
      - name: Commit change
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "specialdogfotos"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "[skip ci] remove decorative preview circle"
          git push
