name: Install campaign analytics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: "!contains(github.event.head_commit.message, '[analytics-installed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install campaign analytics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if 'analytics-config.js' not in s:
              analytics = r'''<script src="analytics-config.js"></script>
<script>
(() => {
  const cfg = window.SPECIAL_DOG_ANALYTICS || {};
  const qs = new URLSearchParams(location.search);
  const campaign = qs.get('campanha') || cfg.defaultCampaign || 'campanha-padrao';
  const source = qs.get('origem') || cfg.defaultSource || 'direto';
  const measurementId = cfg.measurementId || '';

  window.specialDogCampaign = { campaign, source };
  window.dataLayer = window.dataLayer || [];
  window.gtag = window.gtag || function(){ dataLayer.push(arguments); };

  if (measurementId) {
    const script = document.createElement('script');
    script.async = true;
    script.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(measurementId);
    document.head.appendChild(script);
    gtag('js', new Date());
    gtag('config', measurementId, { campaign_id: campaign, campaign_source: source });
  }

  function track(eventName, extra = {}) {
    const payload = { campanha: campaign, origem: source, ...extra };
    if (measurementId) gtag('event', eventName, payload);
    window.dispatchEvent(new CustomEvent('specialdog:analytics', { detail: { eventName, ...payload } }));
  }

  window.specialDogTrack = track;
  track('campaign_visit');

  document.addEventListener('change', (event) => {
    const el = event.target;
    if (el && el.matches('input[type="file"]') && el.files && el.files.length) {
      track('photo_upload', { file_count: el.files.length });
    }
  }, true);

  document.addEventListener('click', (event) => {
    const target = event.target.closest('button, a');
    if (!target) return;
    const text = (target.textContent || '').toLowerCase();
    const id = (target.id || '').toLowerCase();
    if (id === 'download' || text.includes('download') || text.includes('baixar')) {
      track('card_download');
    }
    if (id.includes('share') || text.includes('compartilh')) {
      track('card_share');
    }
  }, true);

  const canvas = document.querySelector('canvas');
  if (canvas && window.MutationObserver) {
    let generated = false;
    const markGenerated = () => {
      if (!generated && canvas.width > 0 && canvas.height > 0) {
        generated = true;
        track('card_generated');
      }
    };
    setTimeout(markGenerated, 1200);
  }
})();
</script>
'''
              marker = '</body>'
              if marker in s:
                  s = s.replace(marker, analytics + '\n' + marker, 1)
              else:
                  s += '\n' + analytics

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit analytics instrumentation
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "[analytics-installed] instrument campaign engagement"
          git push
